[build]
  publish = "."

# Every other domain goes to the main address, liminalcx.com (http and https)
[[redirects]]
  from = "http://www.liminalcx.com/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://liminalcx.co.uk/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.liminalcx.co.uk/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.liminalcx.com/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://liminalcx.co.uk/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.liminalcx.co.uk/*"
  to = "https://liminalcx.com/:splat"
  status = 301
  force = true

# Booking links. Every "Book" button on the site points to /book or /book-power-hour.
# To change a booking page, edit its "to" value and redeploy. Kept as 302 so browsers don't cache it.
[[redirects]]
  from = "/book"
  to = "https://calendar.app.google/tah8WL2MhAwcRbJw9"   # 15-minute intro call (free)
  status = 302

[[redirects]]
  from = "/book-power-hour"
  to = "https://calendar.app.google/2rpX1P7QXTqV8ZBv9"   # Power Hour (paid when booking)
  status = 302

# Old Workshops page moved to Services
[[redirects]]
  from = "/workshops/*"
  to = "/services/:splat"
  status = 301

[[redirects]]
  from = "/workshops"
  to = "/services/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/focus-first/*"
  to = "/ai-audit/:splat"
  status = 301

[[redirects]]
  from = "/focus-first"
  to = "/ai-audit/"
  status = 301

# Notes for editors, not for visitors
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# The draft home page became the real one on 18 Nov 2026
[[redirects]]
  from = "/draft-home/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/draft-home"
  to = "/"
  status = 301

# Free mini courses: the instructions files open as readable text
[[headers]]
  for = "/free/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Personal PA course page: live but hidden from search engines until price, date and booking are set
[[headers]]
  for = "/personal-pa/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Paid self-paced courses (see README "Paid courses"). /learn/<course>/ is locked by
# netlify/edge-functions/course-gate.js; the access code is the Netlify variable CODE_<COURSE>.
[[headers]]
  for = "/learn/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ai-business/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/learn/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Buy button. Swap "to" for the Stripe Payment Link once it exists.
[[redirects]]
  from = "/buy-ai-business"
  to = "/ai-business/"   # placeholder until the Stripe Payment Link is made
  status = 302

# The gate's source code isn't a page
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
