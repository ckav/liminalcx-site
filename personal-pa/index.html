  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Build your own Personal PA...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

icode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Rubik';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/rubik/v31/iJWKBXyIfDnIV7nPrXyi0A.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Rubik';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dc93db99-9808-4695-8240-1426caf67f08\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0}\na{color:#009640}a:hover{color:#007a34}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Rubik', system-ui, sans-serif; color: #000000; background: #ffffff; line-height: 1.5; font-size: 17px\" data-canvas-width=\"1280\" data-canvas-height=\"4200\" data-document-role=\"page\" data-label=\"Sales page\">\n\n  <!-- Nav -->\n  <div style=\"max-width: 1040px; margin: 0 auto; padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px\">\n    <div style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">Build your own Personal PA<\u002Fdiv>\n    <div style=\"font-size: 14px; color: #555555\">A Liminal CX workshop · Claire Kavanagh<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Hero -->\n  <div style=\"max-width: 1040px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-direction: column; gap: 24px\">\n    <div style=\"display: inline-flex; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #CAD400; color: #000000; font-size: 13px; font-weight: 600\">Live online workshop · 2 hours · small group<\u002Fdiv>\n    <h1 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; max-width: 820px\">Build your own life-admin system in two hours. Never miss a renewal again.<\u002Fh1>\n    <p style=\"margin: 0; font-size: 21px; color: #333333; max-width: 720px\">You'll leave with a working system — on your own Google Drive, run by Claude — that knows where your insurance, bills and documents are, and tells you when something's due. You build it. You own it. I walk you through every step.<\u002Fp>\n    <div style=\"display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 8px\">\n      <a href=\"#book\" style=\"display: inline-flex; align-items: center; padding: 16px 28px; background: #CAD400; color: #000000; border-radius: 10px; font-weight: 600; font-size: 17px; text-decoration: none\">Reserve a place · [£PRICE]<\u002Fa>\n      <a href=\"#how\" style=\"display: inline-flex; align-items: center; padding: 16px 8px; color: #009640; font-weight: 600; font-size: 17px; text-decoration: none\">See how the two hours go<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; color: #555555\">Next session: [DATE]. No coding. No new app to learn.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- The problem -->\n  <div style=\"background: #f4f4f4\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px\">\n        <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -0.015em\">Your admin lives in six places and your head.<\u002Fh2>\n        <p style=\"margin: 0; color: #333333\">The car insurance renewal is in an email. The boiler cover is a PDF somewhere. The MOT date is a vague feeling. Every \"I must sort that\" costs you a little attention, every day, until the day it costs you a lot of money.<\u002Fp>\n        <p style=\"margin: 0; color: #333333\">You've tried apps. They want you to live inside them, they want a subscription, and they don't know your actual stuff.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 16px\">\n        <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -0.015em\">One folder. One sheet. An assistant that reads them.<\u002Fh2>\n        <p style=\"margin: 0; color: #333333\">A Personal PA is a Google Drive folder with a structure I've worked out, a sheet that lists every policy, bill and document, and a set of instructions that lets Claude answer questions about it and flag what's coming up.<\u002Fp>\n        <p style=\"margin: 0; color: #333333\">Nothing to install. Nothing hosted by me. If you can use Gmail, you can build this.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Four stages -->\n  <div style=\"max-width: 1040px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-direction: column; gap: 32px\">\n    <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 720px\">\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 36px; line-height: 1.1; letter-spacing: -0.015em\">What a Personal PA does<\u002Fh2>\n      <p style=\"margin: 0; color: #333333; font-size: 18px\">Four stages. In the workshop you finish the first two and switch on the third. The fourth is where it gets clever, and it's optional.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #dcdcdc; border-radius: 14px; background: #ffffff\">\n        <div style=\"font-size: 13px; font-weight: 600; color: #009640; text-transform: uppercase; letter-spacing: 0.06em\">1 · In the workshop<\u002Fdiv>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 24px\">Store<\u002Fdiv>\n        <p style=\"margin: 0; color: #333333; font-size: 15px\">Every policy, bill, contract and document gets one row and one home. Type, provider, cost, renewal date, where the paperwork is.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #dcdcdc; border-radius: 14px; background: #ffffff\">\n        <div style=\"font-size: 13px; font-weight: 600; color: #009640; text-transform: uppercase; letter-spacing: 0.06em\">2 · In the workshop<\u002Fdiv>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 24px\">Retrieve<\u002Fdiv>\n        <p style=\"margin: 0; color: #333333; font-size: 15px\">Ask in plain English. \"What's due before Christmas?\" \"Where's the boiler cover?\" \"How much am I paying for insurance in total?\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #dcdcdc; border-radius: 14px; background: #ffffff\">\n        <div style=\"font-size: 13px; font-weight: 600; color: #009640; text-transform: uppercase; letter-spacing: 0.06em\">3 · Switched on by the end<\u002Fdiv>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 24px\">Notify<\u002Fdiv>\n        <p style=\"margin: 0; color: #333333; font-size: 15px\">It comes to you. A reminder lands 30 days before anything renews, with the current policy and last year's price attached.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #dcdcdc; border-radius: 14px; background: #f4f4f4\">\n        <div style=\"font-size: 13px; font-weight: 600; color: #555555; text-transform: uppercase; letter-spacing: 0.06em\">4 · Add-on module<\u002Fdiv>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 24px\">Action<\u002Fdiv>\n        <p style=\"margin: 0; color: #333333; font-size: 15px\">Draft the cancellation email. Pull renewal letters straight from your inbox. Send it a photo of a bill from your phone. Each one is a short follow-on session.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- How the 2 hours go -->\n  <div id=\"how\" style=\"background: #000000; color: #ffffff\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 48px\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 36px; line-height: 1.1; letter-spacing: -0.015em\">How the two hours go<\u002Fh2>\n        <p style=\"margin: 0; color: #c8c8c8; font-size: 17px\">Live, on a video call, with your laptop open. We build together, step by step, and nobody moves on until everyone's screen looks the same. Bring five real things you want to stop worrying about.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 0\">\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">0:00<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">Set up your folder and sheet<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">Copy my template into your Drive. Understand the five columns that matter.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">0:25<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">Connect Claude to your Drive<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">The one fiddly bit. We do it together, slowly, and check it works before moving on.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">0:45<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">Load your first five records<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">Car insurance, phone contract, whatever you brought. Real things, so it's useful by lunchtime.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">1:10<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">Ask it questions<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">The moment it clicks. You'll get the prompts that work, and learn how to write your own.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">1:35<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">Switch on your first reminder<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">So the system starts working for you before you've closed the laptop.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a\">\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; color: #CAD400\">1:50<\u002Fdiv>\n          <div><div style=\"font-weight: 600\">What to do this week, and what's next<\u002Fdiv><div style=\"color: #c8c8c8; font-size: 15px\">How to fill the rest in, how to change it when it isn't quite right, and what the add-ons do.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- What you need + what you keep -->\n  <div style=\"max-width: 1040px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px\">\n    <div style=\"display: flex; flex-direction: column; gap: 16px\">\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em\">Before you book, check you have<\u002Fh2>\n      <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; color: #333333\">\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #e6f4ec; color: #009640; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">✓<\u002Fspan><span><strong style=\"color: #000000\">A paid Claude account<\u002Fstrong> (Pro or above). The free tier can't connect to Drive.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #e6f4ec; color: #009640; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">✓<\u002Fspan><span><strong style=\"color: #000000\">A Google account<\u002Fstrong> with Drive and Gmail. A personal one is fine.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #e6f4ec; color: #009640; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">✓<\u002Fspan><span><strong style=\"color: #000000\">A laptop<\u002Fstrong> and two uninterrupted hours.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #e6f4ec; color: #009640; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">✓<\u002Fspan><span><strong style=\"color: #000000\">Five real things<\u002Fstrong> you want sorted. Insurance, a subscription, the MOT, the boiler.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <p style=\"margin: 0; font-size: 15px; color: #555555\">That's it. If you have those, you can do this. If you don't, the page isn't for you yet, and I'd rather tell you now.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 16px\">\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em\">What you walk away with<\u002Fh2>\n      <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; color: #333333\">\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #f4f4f4; color: #000000; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">1<\u002Fspan><span>A working Personal PA in your own Drive, with your first records in it and one reminder live.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #f4f4f4; color: #000000; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">2<\u002Fspan><span>The folder template, the sheet, and the instructions file, yours to keep and change.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #f4f4f4; color: #000000; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">3<\u002Fspan><span>The prompts that work, and a one-page guide to writing more.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #f4f4f4; color: #000000; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">4<\u002Fspan><span>The recording, and a setup checklist you can hand to a partner or parent.<\u002Fspan><\u002Fli>\n        <li style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 6px; background: #f4f4f4; color: #000000; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">5<\u002Fspan><span>Access to the add-on sessions as they're released, and a place to request what you wish it did.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Your data -->\n  <div style=\"background: #f4f4f4\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em\">Your data never comes to me<\u002Fh2>\n      <p style=\"margin: 0; color: #333333; max-width: 760px\">The whole thing lives in your Google account. I never see your policies, your bills or your folder. I'm teaching you to build something; I'm not running a service you'll depend on. If I disappear tomorrow, your Personal PA keeps working.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Booking -->\n  <div id=\"book\" style=\"max-width: 1040px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 48px; align-items: start\">\n    <div style=\"display: flex; flex-direction: column; gap: 16px\">\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 36px; line-height: 1.1; letter-spacing: -0.015em\">Reserve a place<\u002Fh2>\n      <p style=\"margin: 0; color: #333333; font-size: 18px\">Small groups, so everyone gets unstuck. Next session [DATE], [TIME] UK. If you can't make it live, the recording and all the materials are included, and you can bring your questions to the following session.<\u002Fp>\n      <p style=\"margin: 0; color: #333333; font-size: 15px\">Not sure it's for you? Email me first: <a href=\"mailto:info@liminalcx.com\">info@liminalcx.com<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 16px; padding: 28px; border: 1px solid #dcdcdc; border-radius: 16px; background: #ffffff\">\n      <div style=\"display: flex; align-items: baseline; gap: 8px\">\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em\">[£PRICE]<\u002Fdiv>\n        <div style=\"color: #555555\">one-off<\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; color: #333333; font-size: 15px\">\n        <li>2-hour live workshop<\u002Fli>\n        <li>Template, sheet and instructions file<\u002Fli>\n        <li>Recording and setup checklist<\u002Fli>\n        <li>Add-on sessions as released<\u002Fli>\n      <\u002Ful>\n      <a href=\"mailto:info@liminalcx.com?subject=Build%20your%20own%20Personal%20PA%20course\" style=\"display: inline-flex; justify-content: center; align-items: center; padding: 16px 28px; background: #CAD400; color: #000000; border-radius: 10px; font-weight: 600; font-size: 17px; text-decoration: none\">Reserve my place<\u002Fa>\n      <div style=\"font-size: 13px; color: #555555\">You'll need a paid Claude account on the day, which is a separate cost to Anthropic and not included.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- About -->\n  <div style=\"max-width: 1040px; margin: 0 auto; padding: 0 24px 72px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #dcdcdc; padding-top: 40px\">\n    <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 20px\">About Claire<\u002Fdiv>\n    <p style=\"margin: 0; color: #333333; max-width: 760px\">I'm a change and customer-experience consultant who spends most of my working life helping people adopt new tools without hating them. I built the first version of this for my own admin, because I was tired of being the only system of record for my own life. This workshop is that system, simplified until a non-technical friend could build it in an afternoon.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#009640&quot;,&quot;options&quot;:[&quot;#009640&quot;,&quot;#CAD400&quot;,&quot;#000000&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4200}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#009640' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
